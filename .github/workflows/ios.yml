name: Generar iOS de EcoRuta

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flet
        run: |
          python3 -m pip install --upgrade pip
          pip3 install "flet[all]"

      - name: Generar aplicación iOS
        run: |
          flet build ios-simulator

      - name: Subir aplicación iOS
        uses: actions/upload-artifact@v4
        with:
          name: EcoRuta-iOS
          path: build/ios-simulator